tasks:

  - id: create_database
    type: io.kestra.plugin.jdbc.snowflake.Query

    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    role: "{{ envs.snowflake_role }}"

    sql: |
      CREATE DATABASE IF NOT EXISTS {{ envs.snowflake_database }};

  - id: create_bronze_schema
    type: io.kestra.plugin.jdbc.snowflake.Query

    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    role: "{{ envs.snowflake_role }}"

    sql: |
      CREATE SCHEMA IF NOT EXISTS {{ envs.snowflake_schema }};


  - id: create_bronze_table
    type: io.kestra.plugin.jdbc.snowflake.Query

    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    schema: "{{ envs.snowflake_schema }}"
    role: "{{ envs.snowflake_role }}"

    sql: |
      CREATE TABLE IF NOT EXISTS ECU911_EMERGENCIAS_RAW (
        FECHA VARCHAR,
        PROVINCIA VARCHAR,
        CANTON VARCHAR,
        COD_PARROQUIA VARCHAR,
        PARROQUIA VARCHAR,
        SERVICIO VARCHAR,
        SUBTIPO VARCHAR,
        _SOURCE_MONTH VARCHAR,
        _SOURCE_FILE VARCHAR,
        _INGESTED_AT TIMESTAMP_NTZ
      );

  - id: download_file
    type: io.kestra.plugin.core.http.Download
    uri: "{{ vars.files[render(vars.run_month)].url }}"

    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3


  - id: prepare_csv
    type: io.kestra.plugin.scripts.python.Script

    taskRunner:
      type: io.kestra.plugin.core.runner.Process

    beforeCommands:
      - pip install --target=./deps pandas openpyxl

    env:
      PYTHONPATH: "./deps"

    inputFiles:
      source_file: "{{ outputs.download_file.uri }}"

    outputFiles:
      - data.csv

    script: |
      import shutil
      import pandas as pd

      source_format = "{{ vars.files[render(vars.run_month)].format }}"

      if source_format == "xlsx":
        df = pd.read_excel(
            "source_file",
            dtype=str,
            keep_default_na=False,
            engine="openpyxl"
        )

        if "Fecha" in df.columns:
            fechas = pd.to_datetime(
                df["Fecha"],
                errors="coerce"
            )

            df["Fecha"] = fechas.dt.strftime("%d/%m/%Y")

        df.to_csv(
            "data.csv",
            index=False,
            sep=";",
            encoding="utf-8"
        )

      elif source_format == "csv":
          shutil.copyfile(
              "source_file",
              "data.csv"
          )

      else:
          raise ValueError(
              f"Formato no soportado: {source_format}"
          )

  - id: upload_to_stage
    type: io.kestra.plugin.jdbc.snowflake.Upload

    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    schema: "{{ envs.snowflake_schema }}"
    role: "{{ envs.snowflake_role }}"

    from: "{{ outputs.prepare_csv.outputFiles['data.csv'] }}"
    fileName: "data.csv"
    prefix: "prepared/{{ render(vars.run_month) }}"
    stageName: "@{{ envs.snowflake_database }}.{{ envs.snowflake_schema }}.%ECU911_EMERGENCIAS_RAW"
    compress: false


  - id: delete_existing_month
    type: io.kestra.plugin.jdbc.snowflake.Query

    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    schema: "{{ envs.snowflake_schema }}"
    role: "{{ envs.snowflake_role }}"

    sql: |
      DELETE FROM ECU911_EMERGENCIAS_RAW
      WHERE _SOURCE_MONTH = '{{ render(vars.run_month) }}';

  - id: copy_into_bronze
    type: io.kestra.plugin.jdbc.snowflake.Query

    retry:
      type: constant
      interval: PT15S
      maxAttempts: 2

    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    schema: "{{ envs.snowflake_schema }}"
    role: "{{ envs.snowflake_role }}"

    sql: |
      COPY INTO ECU911_EMERGENCIAS_RAW (
        FECHA,
        PROVINCIA,
        CANTON,
        COD_PARROQUIA,
        PARROQUIA,
        SERVICIO,
        SUBTIPO,
        _SOURCE_MONTH,
        _SOURCE_FILE,
        _INGESTED_AT
      )
      FROM (
        SELECT
          $1,
          $2,
          $3,
          $4,
          $5,
          $6,
          $7,
          '{{ render(vars.run_month) }}',
          '{{ vars.files[render(vars.run_month)].file }}',
          CURRENT_TIMESTAMP()
        FROM @{{ envs.snowflake_database }}.{{ envs.snowflake_schema }}.%ECU911_EMERGENCIAS_RAW/prepared/{{ render(vars.run_month) }}/data.csv
      )
      FILE_FORMAT = (
        TYPE = CSV
        FIELD_DELIMITER = ';'
        SKIP_HEADER = 1
        FIELD_OPTIONALLY_ENCLOSED_BY = '"'
        COMPRESSION = NONE
        ENCODING = 'UTF8'
      )
      ON_ERROR = 'ABORT_STATEMENT'
      FORCE = TRUE;


triggers:
  - id: monthly_ingestion
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 5 * *"
    timezone: America/Guayaquil
    recoverMissedSchedules: NONE
    allowConcurrent: true