id: ingesta_ecu911
namespace: pset2
description: Ingesta de un periodo mensual de la Base de Emergencias ECU 911 hacia BRONZE.

concurrency:
  limit: 1

inputs:
  - id: periodo
    type: STRING
    defaults: "202107"
    validator: "^\\d{6}$"
    description: Periodo AAAAMM a cargar.

tasks:
  - id: consultar_catalogo
    type: io.kestra.plugin.core.http.Request
    uri: "https://www.datosabiertos.gob.ec/api/3/action/package_show?id=00c650e7-42a9-4f3c-9f29-45000091f8b3"
    method: GET
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 4

  - id: seleccionar_recurso
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    inputFiles:
      catalogo.json: "{{ outputs.consultar_catalogo.body }}"
    script: |
      import json
      import re
      import sys

      periodo = "{{ inputs.periodo }}"

      with open("catalogo.json", encoding="utf-8") as f:
          catalogo = json.load(f)

      if not catalogo.get("success"):
          sys.exit(f"CKAN respondió success=false: {catalogo.get('error')}")

      patron = re.compile(r"_(\d{6})(?!\d)")
      candidatos = [
          r for r in catalogo["result"]["resources"]
          if (m := patron.search(r["name"])) and m.group(1) == periodo
      ]

      if len(candidatos) != 1:
          nombres = [r["name"] for r in candidatos]
          sys.exit(f"Se esperaba 1 recurso para {periodo}, se encontraron {len(candidatos)}: {nombres}")

      recurso = candidatos[0]
      if recurso.get("mimetype") != "text/csv":
          sys.exit(f"El recurso {recurso['name']} no es CSV (mimetype={recurso.get('mimetype')!r}); COPY INTO no puede cargarlo")

      salida = {
          "url": recurso["url"],
          "resource_id": recurso["id"],
          "name": recurso["name"],
          "size": recurso["size"],
          "last_modified": recurso["last_modified"],
      }
      print("::" + json.dumps({"outputs": salida}) + "::")

  - id: descargar_archivo
    type: io.kestra.plugin.core.http.Download
    uri: "{{ outputs.seleccionar_recurso.vars.url }}"
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 4

  - id: validar_archivo
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    inputFiles:
      datos.csv: "{{ outputs.descargar_archivo.uri }}"
    script: |
      import csv
      import json
      import os
      import sys

      ENCABEZADO = ["Fecha", "provincia", "Canton", "Cod_Parroquia", "Parroquia", "Servicio", "Subtipo"]
      tamano_esperado = {{ outputs.seleccionar_recurso.vars.size }}

      tamano = os.path.getsize("datos.csv")
      if tamano != tamano_esperado:
          sys.exit(f"Descarga incompleta o distinta: {tamano} bytes, CKAN reporta {tamano_esperado}")

      with open("datos.csv", "rb") as f:
          tiene_bom = f.read(3) == b"\xef\xbb\xbf"

      try:
          with open("datos.csv", encoding="utf-8-sig", newline="") as f:
              lector = csv.reader(f, delimiter=";", quotechar='"')
              encabezado = next(lector)
              # Algunos meses (p. ej. 202110) terminan cada linea con un ';' sobrante: se acepta
              # una octava columna solo si su nombre esta vacio y viene en blanco en todas las filas.
              con_columna_extra = encabezado == ENCABEZADO + [""]
              if encabezado != ENCABEZADO and not con_columna_extra:
                  sys.exit(f"Encabezado inesperado: {encabezado}")
              ancho = len(encabezado)

              filas = 0
              anchos_invalidos = []
              extra_con_dato = []
              for fila in lector:
                  filas += 1
                  if len(fila) != ancho:
                      if len(anchos_invalidos) < 10:
                          anchos_invalidos.append((lector.line_num, len(fila)))
                  elif con_columna_extra and fila[-1].strip() != "":
                      if len(extra_con_dato) < 10:
                          extra_con_dato.append((lector.line_num, fila[-1]))
      except UnicodeDecodeError as e:
          sys.exit(f"El archivo no es UTF-8 válido: {e}")

      if anchos_invalidos:
          sys.exit(f"Filas con número de columnas distinto de {ancho} (línea, columnas): {anchos_invalidos}")
      if extra_con_dato:
          sys.exit(f"La columna sobrante trae datos (línea, valor): {extra_con_dato}")

      salida = {"bytes": tamano, "filas": filas, "tiene_bom": tiene_bom, "columnas_archivo": ancho}
      print("::" + json.dumps({"outputs": salida}) + "::")

  - id: limpiar_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    role: "{{ envs.snowflake_role }}"
    schema: BRONZE
    sql: REMOVE @BRONZE.STG_EMERGENCIAS/periodo={{ inputs.periodo }}/

  - id: subir_a_stage
    type: io.kestra.plugin.jdbc.snowflake.Upload
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    role: "{{ envs.snowflake_role }}"
    schema: BRONZE
    from: "{{ outputs.descargar_archivo.uri }}"
    stageName: "@BRONZE.STG_EMERGENCIAS"
    prefix: "periodo={{ inputs.periodo }}"
    fileName: "emergencias_{{ inputs.periodo }}.csv"
    compress: true

  - id: cargar_bronze
    type: io.kestra.plugin.jdbc.snowflake.Queries
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    role: "{{ envs.snowflake_role }}"
    schema: BRONZE
    transaction: true
    sql: |
      DELETE FROM BRONZE.EMERGENCIAS WHERE _PERIODO = '{{ inputs.periodo }}';

      COPY INTO BRONZE.EMERGENCIAS (
        FECHA, PROVINCIA, CANTON, COD_PARROQUIA, PARROQUIA, SERVICIO, SUBTIPO,
        _PERIODO, _RESOURCE_ID, _SOURCE_LAST_MODIFIED, _SOURCE_FILE, _FILE_ROW_NUMBER, _LOADED_AT
      )
      FROM (
        SELECT
          $1, $2, $3, $4, $5, $6, $7,
          '{{ inputs.periodo }}',
          '{{ outputs.seleccionar_recurso.vars.resource_id }}',
          TO_TIMESTAMP_NTZ('{{ outputs.seleccionar_recurso.vars.last_modified }}', 'YYYY-MM-DD"T"HH24:MI:SS.FF'),
          METADATA$FILENAME,
          METADATA$FILE_ROW_NUMBER,
          CURRENT_TIMESTAMP()
        FROM @BRONZE.STG_EMERGENCIAS/periodo={{ inputs.periodo }}/
      )
      FILE_FORMAT = (FORMAT_NAME = 'BRONZE.FF_CSV_ECU911')
      ON_ERROR = ABORT_STATEMENT
      FORCE = TRUE;

  - id: verificar_carga
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    role: "{{ envs.snowflake_role }}"
    schema: BRONZE
    fetchType: FETCH_ONE
    sql: |
      SELECT
        COUNT(*)                                AS FILAS,
        COUNT(DISTINCT _FILE_ROW_NUMBER)        AS FILAS_UNICAS,
        COUNT(DISTINCT _SOURCE_FILE)            AS ARCHIVOS,
        COUNT_IF(FECHA = 'Fecha')               AS ENCABEZADOS,
        COUNT_IF(ENDSWITH(SUBTIPO, CHR(13)))    AS CON_RETORNO_CARRO,
        MIN(_FILE_ROW_NUMBER)                   AS PRIMERA_FILA,
        MAX(_FILE_ROW_NUMBER)                   AS ULTIMA_FILA,
        TO_VARCHAR(MAX(_LOADED_AT))             AS CARGADO_EN
      FROM BRONZE.EMERGENCIAS
      WHERE _PERIODO = '{{ inputs.periodo }}'

  - id: conciliar
    type: io.kestra.plugin.core.execution.Assert
    errorMessage: "La carga de {{ inputs.periodo }} no concilia con el archivo validado ({{ outputs.validar_archivo.vars.filas }} filas)"
    conditions:
      - "{{ outputs.verificar_carga.row.FILAS == outputs.validar_archivo.vars.filas }}"
      - "{{ outputs.verificar_carga.row.FILAS_UNICAS == outputs.validar_archivo.vars.filas }}"
      - "{{ outputs.verificar_carga.row.ARCHIVOS == 1 }}"
      - "{{ outputs.verificar_carga.row.ENCABEZADOS == 0 }}"
      - "{{ outputs.verificar_carga.row.CON_RETORNO_CARRO == 0 }}"
