tasks:
  - id: create_tables
    type: io.kestra.plugin.jdbc.snowflake.Queries

    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?MULTI_STATEMENT_COUNT=0"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    schema: "{{ envs.snowflake_schema }}"
    role: "{{ envs.snowflake_role }}"

    sql: |
      CREATE TABLE IF NOT EXISTS EMERGENCIAS_RAW (
          FECHA VARCHAR,
          PROVINCIA VARCHAR,
          CANTON VARCHAR,
          COD_PARROQUIA VARCHAR,
          PARROQUIA VARCHAR,
          SERVICIO VARCHAR,
          SUBTIPO VARCHAR,
          SOURCE_PERIOD VARCHAR
      );

      CREATE TABLE IF NOT EXISTS EMERGENCIAS_CONTROL (
          SOURCE_PERIOD VARCHAR,
          EXPECTED_COUNT NUMBER
      );

  - id: months
    type: io.kestra.plugin.core.flow.ForEach

    values: "{{ vars.sources }}"
    concurrencyLimit: 1

    tasks:
      - id: check_month
        type: io.kestra.plugin.jdbc.snowflake.Query

        url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?MULTI_STATEMENT_COUNT=0"
        username: "{{ envs.snowflake_user }}"
        password: "{{ envs.snowflake_password }}"
        warehouse: "{{ envs.snowflake_warehouse }}"
        database: "{{ envs.snowflake_database }}"
        schema: "{{ envs.snowflake_schema }}"
        role: "{{ envs.snowflake_role }}"

        sql: |
          SELECT
              CURRENT_COUNT,
              EXPECTED_COUNT,
              IFF(
                  EXPECTED_COUNT IS NULL
                  OR CURRENT_COUNT <> EXPECTED_COUNT,
                  TRUE,
                  FALSE
              ) AS NEEDS_LOAD
          FROM (
              SELECT
                  (
                      SELECT COUNT(*)
                      FROM EMERGENCIAS_RAW
                      WHERE SOURCE_PERIOD =
                          '{{ fromJson(taskrun.value).period }}'
                  ) AS CURRENT_COUNT,
                  (
                      SELECT MAX(EXPECTED_COUNT)
                      FROM EMERGENCIAS_CONTROL
                      WHERE SOURCE_PERIOD =
                          '{{ fromJson(taskrun.value).period }}'
                  ) AS EXPECTED_COUNT
          );

        fetchType: FETCH_ONE

      - id: load_if_needed
        type: io.kestra.plugin.core.flow.If

        condition: "{{ outputs.check_month[taskrun.value].row.NEEDS_LOAD }}"

        then:
          - id: download
            type: io.kestra.plugin.core.http.Download

            uri: "{{ fromJson(parent.taskrun.value).url }}"

            retry:
              type: constant
              interval: PT10S
              maxAttempts: 3

          - id: prepare_file
            type: io.kestra.plugin.scripts.python.Script

            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker

            containerImage: python:3.12-slim

            dependencies:
              - pandas
              - openpyxl
              - kestra

            inputFiles:
              source_file: "{{ outputs.download[parent.taskrun.value].uri }}"

            outputFiles:
              - prepared.csv

            script: |
              import csv
              import unicodedata

              import pandas as pd
              from kestra import Kestra


              file_format = "{{ fromJson(parent.taskrun.value).format }}"

              canonical_columns = [
                  "Fecha",
                  "provincia",
                  "Canton",
                  "Cod_Parroquia",
                  "Parroquia",
                  "Servicio",
                  "Subtipo",
              ]


              def normalize_column(value):
                  value = str(value).replace("\ufeff", "").strip()

                  return "".join(
                      character
                      for character in unicodedata.normalize("NFD", value)
                      if unicodedata.category(character) != "Mn"
                  ).lower()


              expected_columns = [
                  normalize_column(column)
                  for column in canonical_columns
              ]


              if file_format == "csv":
                  row_count = 0

                  with open(
                      "source_file",
                      "r",
                      encoding="utf-8-sig",
                      newline=""
                  ) as source:
                      reader = csv.reader(
                          source,
                          delimiter=";",
                          quotechar='"',
                          strict=True
                      )

                      try:
                          source_header = next(reader)
                      except StopIteration:
                          raise ValueError(
                              "El archivo CSV está vacío"
                          )

                      received_columns = [
                          normalize_column(column)
                          for column in source_header[:7]
                      ]

                      if received_columns != expected_columns:
                          raise ValueError(
                              "Encabezado CSV inesperado: "
                              + repr(source_header)
                          )

                      with open(
                          "prepared.csv",
                          "w",
                          encoding="utf-8",
                          newline=""
                      ) as destination:
                          writer = csv.writer(
                              destination,
                              delimiter=";",
                              quotechar='"',
                              quoting=csv.QUOTE_MINIMAL,
                              lineterminator="\n"
                          )

                          writer.writerow(canonical_columns)

                          for line_number, row in enumerate(
                              reader,
                              start=2
                          ):
                              if not row or all(
                                  not value.strip()
                                  for value in row
                              ):
                                  continue

                              if len(row) < 7:
                                  raise ValueError(
                                      f"Fila {line_number} tiene "
                                      f"{len(row)} columnas; se esperaban 7"
                                  )

                              extra_values = row[7:]

                              if any(
                                  value.strip()
                                  for value in extra_values
                              ):
                                  raise ValueError(
                                      f"Fila {line_number} contiene "
                                      "columnas adicionales con datos"
                                  )

                              writer.writerow(row[:7])
                              row_count += 1

              elif file_format == "xlsx":
                  dataframe = pd.read_excel(
                      "source_file",
                      dtype=str,
                      keep_default_na=False,
                      engine="openpyxl"
                  )

                  available_columns = {
                      normalize_column(column): column
                      for column in dataframe.columns
                  }

                  missing_columns = [
                      column
                      for column in expected_columns
                      if column not in available_columns
                  ]

                  if missing_columns:
                      raise ValueError(
                          "Faltan columnas en el Excel: "
                          + repr(missing_columns)
                      )

                  dataframe = dataframe[
                      [
                          available_columns[column]
                          for column in expected_columns
                      ]
                  ].copy()

                  dataframe.columns = canonical_columns

                  parsed_dates = pd.to_datetime(
                      dataframe["Fecha"],
                      errors="coerce",
                      dayfirst=True
                  )

                  dataframe.loc[
                      parsed_dates.notna(),
                      "Fecha"
                  ] = parsed_dates[
                      parsed_dates.notna()
                  ].apply(
                      lambda value:
                      f"{value.day}/{value.month}/{value.year}"
                  )

                  dataframe.to_csv(
                      "prepared.csv",
                      sep=";",
                      index=False,
                      encoding="utf-8",
                      lineterminator="\n"
                  )

                  row_count = len(dataframe)

              else:
                  raise ValueError(
                      f"Formato no soportado: {file_format}"
                  )


              print(
                  f"Registros preparados: {row_count}"
              )

              Kestra.outputs({
                  "row_count": int(row_count)
              })

          - id: upload
            type: io.kestra.plugin.jdbc.snowflake.Upload

            url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?MULTI_STATEMENT_COUNT=0"
            username: "{{ envs.snowflake_user }}"
            password: "{{ envs.snowflake_password }}"
            warehouse: "{{ envs.snowflake_warehouse }}"
            database: "{{ envs.snowflake_database }}"
            schema: "{{ envs.snowflake_schema }}"
            role: "{{ envs.snowflake_role }}"

            from: "{{ outputs.prepare_file[parent.taskrun.value].outputFiles['prepared.csv'] }}"
            stageName: "@{{ envs.snowflake_database }}.{{ envs.snowflake_schema }}.%EMERGENCIAS_RAW"
            prefix: "{{ fromJson(parent.taskrun.value).period }}/{{ execution.id }}"
            fileName: "emergencias.csv"
            compress: false

          - id: load_month
            type: io.kestra.plugin.jdbc.snowflake.Queries

            url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?MULTI_STATEMENT_COUNT=0"
            username: "{{ envs.snowflake_user }}"
            password: "{{ envs.snowflake_password }}"
            warehouse: "{{ envs.snowflake_warehouse }}"
            database: "{{ envs.snowflake_database }}"
            schema: "{{ envs.snowflake_schema }}"
            role: "{{ envs.snowflake_role }}"

            transaction: true

            sql: |
              DELETE FROM EMERGENCIAS_RAW
              WHERE SOURCE_PERIOD =
                  '{{ fromJson(parent.taskrun.value).period }}';

              COPY INTO EMERGENCIAS_RAW (
                  FECHA,
                  PROVINCIA,
                  CANTON,
                  COD_PARROQUIA,
                  PARROQUIA,
                  SERVICIO,
                  SUBTIPO,
                  SOURCE_PERIOD
              )
              FROM (
                  SELECT
                      $1,
                      $2,
                      $3,
                      $4,
                      $5,
                      $6,
                      $7,
                      '{{ fromJson(parent.taskrun.value).period }}'
                  FROM @{{ envs.snowflake_database }}.{{ envs.snowflake_schema }}.%EMERGENCIAS_RAW/{{ fromJson(parent.taskrun.value).period }}/{{ execution.id }}/emergencias.csv
              )
              FILE_FORMAT = (
                  TYPE = 'CSV'
                  FIELD_DELIMITER = ';'
                  SKIP_HEADER = 1
                  FIELD_OPTIONALLY_ENCLOSED_BY = '"'
                  EMPTY_FIELD_AS_NULL = FALSE
                  ERROR_ON_COLUMN_COUNT_MISMATCH = TRUE
              )
              FORCE = TRUE
              ON_ERROR = 'ABORT_STATEMENT';

              DELETE FROM EMERGENCIAS_CONTROL
              WHERE SOURCE_PERIOD =
                  '{{ fromJson(parent.taskrun.value).period }}';

              INSERT INTO EMERGENCIAS_CONTROL (
                  SOURCE_PERIOD,
                  EXPECTED_COUNT
              )
              VALUES (
                  '{{ fromJson(parent.taskrun.value).period }}',
                  {{ outputs.prepare_file[parent.taskrun.value].vars.row_count }}
              );

            retry:
              type: constant
              interval: PT10S
              maxAttempts: 3

        else:
          - id: month_ok
            type: io.kestra.plugin.core.log.Log

            message: |
              El periodo {{ fromJson(parent.taskrun.value).period }}
              ya está completo. No se vuelve a cargar.

  # El repositorio se clona en un directorio de trabajo compartido por las
  # tareas dbt y Spark. Si Bronze o dbt fallan, Spark nunca se ejecuta.
  - id: transform_and_build_obt
    type: io.kestra.plugin.core.flow.WorkingDirectory

    tasks:
      - id: clone_project
        type: io.kestra.plugin.git.Clone
        url: https://github.com/junilai/Pset_2.git
        branch: juandi
        depth: 1

      - id: dbt_build
        type: io.kestra.plugin.scripts.shell.Commands

        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker

        containerImage: ghcr.io/kestra-io/dbt-snowflake:latest

        env:
          SNOWFLAKE_ACCOUNT: "{{ envs.snowflake_account }}"
          SNOWFLAKE_USER: "{{ envs.snowflake_user }}"
          SNOWFLAKE_PASSWORD: "{{ envs.snowflake_password }}"
          SNOWFLAKE_WAREHOUSE: "{{ envs.snowflake_warehouse }}"
          SNOWFLAKE_DATABASE: "{{ envs.snowflake_database }}"
          SNOWFLAKE_SCHEMA: "{{ envs.snowflake_schema }}"
          SNOWFLAKE_ROLE: "{{ envs.snowflake_role }}"

        commands:
          - cd dbt && dbt build --profiles-dir . --no-partial-parse

        retry:
          type: constant
          interval: PT20S
          maxAttempts: 2
          behavior: CREATE_NEW_EXECUTION

      - id: spark_build_obt
        type: io.kestra.plugin.scripts.shell.Commands

        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          user: root

        containerImage: apache/spark:4.0.0

        env:
          SNOWFLAKE_ACCOUNT: "{{ envs.snowflake_account }}"
          SNOWFLAKE_USER: "{{ envs.snowflake_user }}"
          SNOWFLAKE_PASSWORD: "{{ envs.snowflake_password }}"
          SNOWFLAKE_WAREHOUSE: "{{ envs.snowflake_warehouse }}"
          SNOWFLAKE_DATABASE: "{{ envs.snowflake_database }}"
          SNOWFLAKE_SCHEMA: "{{ envs.snowflake_schema }}"
          SNOWFLAKE_ROLE: "{{ envs.snowflake_role }}"
          TRAINING_CUTOFF: "2024-12-31"
          VALIDATION_CUTOFF: "2025-12-31"

        commands:
          - >-
            /opt/spark/bin/spark-submit
            --master "local[*]"
            --driver-memory 4g
            --conf "spark.jars.ivy=/tmp/.ivy2"
            --packages "net.snowflake:spark-snowflake_2.13:3.2.2-spark_4.0,net.snowflake:snowflake-jdbc:4.0.2"
            spark/build_obt.py

        retry:
          type: constant
          interval: PT20S
          maxAttempts: 2
          behavior: CREATE_NEW_EXECUTION

  - id: validate_obt
    type: io.kestra.plugin.jdbc.snowflake.Query

    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?MULTI_STATEMENT_COUNT=0"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    schema: GOLD
    role: "{{ envs.snowflake_role }}"

    sql: |
      SELECT
          COUNT(*) AS ROW_COUNT,
          COUNT(DISTINCT TO_VARCHAR(AS_OF_DATE) || '|' || CANTON_KEY)
              AS GRAIN_COUNT,
          COUNT_IF(AS_OF_TOTAL_INCIDENTS IS NULL) AS NULL_TOTALS,
          COUNT_IF(
              AS_OF_DATE_KEY <>
              TO_NUMBER(TO_CHAR(AS_OF_DATE, 'YYYYMMDD'))
          ) AS BAD_DATE_KEYS
      FROM OBT_CANTON_HIGH_DEMAND_SPARK;

    fetchType: FETCH_ONE

  - id: assert_obt_quality
    type: io.kestra.plugin.core.execution.Assert

    conditions:
      - "{{ outputs.validate_obt.row.ROW_COUNT > 0 }}"
      - "{{ outputs.validate_obt.row.ROW_COUNT == outputs.validate_obt.row.GRAIN_COUNT }}"
      - "{{ outputs.validate_obt.row.NULL_TOTALS == 0 }}"
      - "{{ outputs.validate_obt.row.BAD_DATE_KEYS == 0 }}"

    errorMessage: |
      La OBT no superó las validaciones finales de grano, nulos o claves de fecha.

  - id: pipeline_complete
    type: io.kestra.plugin.core.log.Log

    message: |
      Pipeline completado: Bronze, Silver, Gold y OBT validados.
      Filas OBT: {{ outputs.validate_obt.row.ROW_COUNT }}.

triggers:
  - id: monthly_check
    type: io.kestra.plugin.core.trigger.Schedule

    cron: "0 8 15 * *"
    timezone: America/Guayaquil
    recoverMissedSchedules: LAST
