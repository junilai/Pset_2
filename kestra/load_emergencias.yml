id: load_emergencias
namespace: pset2

description: |
  Pipeline end-to-end de emergencias ECU911.
  Revisa y carga solamente los meses faltantes o incompletos en Bronze,
  construye Silver y Gold con dbt, genera la OBT con Spark y valida el
  resultado final en Snowflake.

# Impide que una ejecución manual y otra programada modifiquen el mismo mes
# al mismo tiempo. Las ejecuciones adicionales esperan su turno.
concurrency:
  limit: 1
  behavior: QUEUE

