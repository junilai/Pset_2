name: pset-2-pipeline

services:

  # Base de datos interna de Kestra
  kestra-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra
      POSTGRES_DB: kestra

    volumes:
      - kestra-db-data:/var/lib/postgresql/data


  # Kestra
  kestra:
    image: kestra/kestra:v1.3.37
    user: root

    command: ["server", "standalone"]

    ports:
      - 8080:8080

    environment:

      # Variables para conectarnos a Snowflake
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      ENV_SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      ENV_SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      ENV_SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      ENV_SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}

      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-db:5432/kestra
            driver-class-name: org.postgresql.Driver
            username: kestra
            password: kestra

        kestra:
          server:
            basic-auth:
              enabled: false

          repository:
            type: postgres

          queue:
            type: postgres

          storage:
            type: local
            local:
              base-path: /app/storage

          tasks:
            tmp-dir:
              # Ruta ejecutable y compartida con los contenedores del Docker Task Runner.
              # /tmp en Docker Desktop para Windows está montado con "noexec".
              path: /opt/kestra-wd/tmp

          url: http://localhost:8080

    volumes:
      - kestra-storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/kestra-wd:/opt/kestra-wd

    depends_on:
      - kestra-db


  # Python
  python:
    image: python:3.12-slim

    working_dir: /app

    command: tail -f /dev/null

    volumes:
      - ./python:/app

    environment:
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}


  # Spark
  spark:
    image: apache/spark:4.0.0

    user: root

    working_dir: /app

    command: tail -f /dev/null

    volumes:
      - ./spark:/app
      # Conserva los conectores Maven entre ejecuciones de spark-submit.
      - spark-ivy-cache:/root/.ivy2

    environment:
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      TRAINING_CUTOFF: "2024-12-31"
      VALIDATION_CUTOFF: "2025-12-31"


  # dbt Core para construir y probar las capas Silver y Gold manualmente.
  dbt:
    image: ghcr.io/kestra-io/dbt-snowflake:latest

    working_dir: /usr/app

    command: tail -f /dev/null

    volumes:
      - ./dbt:/usr/app

    environment:
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}


volumes:
  kestra-db-data:
  kestra-storage:
  spark-ivy-cache:
